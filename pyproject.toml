[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "framechoreo"
version = "1.0.0rc6"
description = "Record pandas workflows as interactive, traceable stories."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "miruky" }]
keywords = ["pandas", "animation", "education", "dataframe", "lineage"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Education",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: OS Independent",
  "Topic :: Education",
  "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = ["pandas>=2.2.3,<3.1", "numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "hypothesis>=6", "ruff>=0.9", "build>=1.2", "twine>=6", "mypy>=2.3.1,<2.4", "pandas-stubs>=3.0.5,<3.1"]
notebook = ["jupyterlab>=4.4,<5", "nbclient>=0.10,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/framechoreo"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "examples/*.py", "examples/*.ipynb", "docs/", "README.md", "README.ja.md", "LICENSE", "CHANGELOG.md", "CONTRIBUTING.md", "CODE_OF_CONDUCT.md", "SECURITY.md", "pyproject.toml", "package.json", "package-lock.json", ".prettierrc.json", ".github/", ".gitignore"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["error"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
check_untyped_defs = true
disallow_incomplete_defs = true
warn_unused_ignores = true

[tool.coverage.run]
source = ["framechoreo"]
branch = true

[tool.coverage.report]
show_missing = true
