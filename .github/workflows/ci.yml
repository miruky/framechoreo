name: checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: "3.11", pandas: "2.2.3"}
          - {os: ubuntu-latest, python: "3.13", pandas: "3.0.6"}
          - {os: ubuntu-latest, python: "3.14", pandas: "3.0.6"}
          - {os: macos-latest, python: "3.13", pandas: "3.0.6"}
          - {os: windows-latest, python: "3.13", pandas: "3.0.6"}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ".[dev]" "pandas==${{ matrix.pandas }}"
      - run: python -m pytest
      - run: python -m ruff check .
      - run: python -m ruff format --check .
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - run: python -m pip install ".[dev]"
      - run: node --test tests/player-model.test.cjs
      - run: python -m build
      - run: python -m twine check dist/*
