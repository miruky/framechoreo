name: checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: "3.11", pandas: "2.2.3", numpy: "==1.26.4"}
          - {os: ubuntu-latest, python: "3.12", pandas: "3.0.6", numpy: ">=2"}
          - {os: ubuntu-latest, python: "3.13", pandas: "2.2.3", numpy: ">=2"}
          - {os: ubuntu-latest, python: "3.13", pandas: "3.0.6", numpy: ">=2"}
          - {os: ubuntu-latest, python: "3.14", pandas: "3.0.6", numpy: ">=2"}
          - {os: macos-latest, python: "3.13", pandas: "3.0.6", numpy: ">=2"}
          - {os: windows-latest, python: "3.13", pandas: "3.0.6", numpy: ">=2"}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ".[dev]" "pandas==${{ matrix.pandas }}" "numpy${{ matrix.numpy }}"
      - run: python -m pytest
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - if: matrix.python == '3.11'
        run: python -m mypy src/framechoreo
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - run: python -m pip install ".[dev]"
      - run: npm ci
      - run: npm audit
      - run: python -m pip install pip-audit==2.10.1
      - run: python -m pip_audit .
      - run: npm run format:check
      - run: npm test
      - run: python tests/check_wire.py
      - run: python examples/sales_story.py
      - run: python examples/build_public_demo.py
      - run: python examples/missing_values.py
      - run: python examples/classroom.py
      - run: python examples/float_precision.py
      - run: python examples/blank_strings.py
      - run: python examples/group_aggregates.py
      - run: python examples/motion_showcase.py
      - run: python examples/retail_workflow.py
      - run: python examples/reshape_workflow.py
      - run: python examples/decision_window_workflow.py
      - run: python examples/compound_conditions_workflow.py
      - run: python examples/join_audit_workflow.py
      - run: python examples/group_transform_workflow.py
      - run: python examples/ordered_cases_workflow.py
      - run: python examples/asof_workflow.py
      - run: python examples/rank_workflow.py
      - run: python examples/growth_workflow.py
      - run: python examples/time_buckets_workflow.py
      - run: python examples/large_group_workflow.py --rows 1000
      - run: python examples/large_window_workflow.py --rows 1000
      - run: python examples/large_analysis.py --rows 2000
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python tests/check_distribution.py
      - run: python -m pip install ".[notebook]"
      - run: python tests/check_notebook.py
